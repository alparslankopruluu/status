[package]
name = "status-owl"
version = "1.0.0"
description = "Cross-Platform macOS Menu Bar & Windows System Tray AI Quota Monitor"
authors = ["Alparslan Köprülü"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
